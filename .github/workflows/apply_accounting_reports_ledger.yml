name: Apply Return-Aware Accounting Ledger

on:
  push:
    branches: ["audit/accounting-integrity-109"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/accounting-integrity-109
      - name: Patch ReportsService
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/features/reports/data/reports_service.dart')
          s=p.read_text()
          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {c}')
              s=s.replace(old,new,1)

          once("import '../../orders/data/order_cost_snapshot_repository.dart';\n", "import '../../orders/data/order_cost_snapshot_repository.dart';\nimport '../../orders/data/order_return_repository.dart';\nimport '../../orders/data/return_cost_snapshot_repository.dart';\n", 'imports repositories')
          once("import '../../orders/domain/order.dart';\n", "import '../../orders/domain/order.dart';\nimport '../../orders/domain/order_return.dart';\n", 'import return model')

          once("  final List<CustomerDebtPayment> debtPayments;\n  final Map<String, double> protectedOrderCosts;\n", "  final List<CustomerDebtPayment> debtPayments;\n  final List<OrderReturn> returns;\n  final List<OrderReturn> balanceReturns;\n  final Map<String, double> protectedOrderCosts;\n  final Map<String, double> protectedReturnCosts;\n", 'fields')

          old="""    this.debtPayments = const [],
    this.protectedOrderCosts = const {},
    this.canViewCost = true,
    this.defaultTaxPercentage = 0.0,
    this.defaultIsTaxInclusive = true,
  });
"""
          new="""    this.debtPayments = const [],
    this.returns = const [],
    List<OrderReturn>? balanceReturns,
    this.protectedOrderCosts = const {},
    this.protectedReturnCosts = const {},
    this.canViewCost = true,
    this.defaultTaxPercentage = 0.0,
    this.defaultIsTaxInclusive = true,
  }) : balanceReturns = balanceReturns ?? returns;
"""
          once(old,new,'constructor')

          old="""    final filteredDebtPayments = debtPayments
        .where((payment) => withinRange(payment.createdAt))
        .toList();
    final filteredIds = filteredOrders.map((order) => order.id).toSet();
    final filteredProtectedCosts = <String, double>{
      for (final entry in protectedOrderCosts.entries)
        if (filteredIds.contains(entry.key)) entry.key: entry.value,
    };

    return ReportsService(
"""
          new="""    final filteredDebtPayments = debtPayments
        .where((payment) => withinRange(payment.createdAt))
        .toList();
    final filteredReturns =
        returns.where((value) => withinRange(value.createdAt)).toList();
    final filteredIds = filteredOrders.map((order) => order.id).toSet();
    final filteredReturnIds = filteredReturns.map((value) => value.id).toSet();
    final filteredProtectedCosts = <String, double>{
      for (final entry in protectedOrderCosts.entries)
        if (filteredIds.contains(entry.key)) entry.key: entry.value,
    };
    final filteredProtectedReturnCosts = <String, double>{
      for (final entry in protectedReturnCosts.entries)
        if (filteredReturnIds.contains(entry.key)) entry.key: entry.value,
    };

    return ReportsService(
"""
          once(old,new,'filter prelude')

          once("""      debtPayments: filteredDebtPayments,
      protectedOrderCosts: filteredProtectedCosts,
      canViewCost: canViewCost,
""", """      debtPayments: filteredDebtPayments,
      returns: filteredReturns,
      balanceReturns: balanceReturns,
      protectedOrderCosts: filteredProtectedCosts,
      protectedReturnCosts: filteredProtectedReturnCosts,
      canViewCost: canViewCost,
""", 'filter constructor args')

          old="""  double get totalRevenue => orders
      .where((order) =>
          order.status != 'cancelled' && order.status != 'debt_repayment')
      .fold(0.0, (sum, order) => sum + order.total);

  double get netSalesRevenue => totalRevenue - totalTaxCollected;
"""
          new="""  double get grossRevenue => orders
      .where((order) =>
          order.status != 'cancelled' && order.status != 'debt_repayment')
      .fold(0.0, (sum, order) => sum + order.total);

  double get totalReturns =>
      returns.fold(0.0, (sum, value) => sum + value.returnedTotal);

  /// Sales including tax, net of returns recorded in the report period.
  double get totalRevenue => grossRevenue - totalReturns;

  double get netSalesRevenue => totalRevenue - totalTaxCollected;
"""
          once(old,new,'revenue getters')

          old="""    final orderOutstanding = orders
        .where((order) => order.status != 'cancelled' && order.isCredit)
        .fold(0.0, (sum, order) => sum + (order.total - order.paidAmount));
"""
          new="""    final returnedByOrder = <String, double>{};
    for (final value in balanceReturns) {
      returnedByOrder[value.originalOrderId] =
          (returnedByOrder[value.originalOrderId] ?? 0.0) + value.returnedTotal;
    }
    final orderOutstanding = orders
        .where((order) => order.status != 'cancelled' && order.isCredit)
        .fold(0.0, (sum, order) {
      final outstanding = order.total -
          order.paidAmount -
          (returnedByOrder[order.id] ?? 0.0);
      return sum + (outstanding > 0 ? outstanding : 0.0);
    });
"""
          once(old,new,'debt returns')

          old="""  double get totalCOGS {
    if (!canViewCost) return 0.0;
    return orders
        .where((order) =>
            order.status != 'cancelled' && order.status != 'debt_repayment')
        .fold(0.0, (sum, order) {
      final protected = protectedOrderCosts[order.id];
      if (protected != null) return sum + protected;
      final legacy = order.items.fold<double>(
        0.0,
        (itemSum, item) => itemSum + ((item.costPrice ?? 0.0) * item.quantity),
      );
      return sum + legacy;
    });
  }
"""
          new="""  double get grossCOGS {
    if (!canViewCost) return 0.0;
    return orders
        .where((order) =>
            order.status != 'cancelled' && order.status != 'debt_repayment')
        .fold(0.0, (sum, order) {
      final protected = protectedOrderCosts[order.id];
      if (protected != null) return sum + protected;
      final legacy = order.items.fold<double>(
        0.0,
        (itemSum, item) => itemSum + ((item.costPrice ?? 0.0) * item.quantity),
      );
      return sum + legacy;
    });
  }

  double get returnedCOGS {
    if (!canViewCost) return 0.0;
    return returns.fold(
      0.0,
      (sum, value) => sum + (protectedReturnCosts[value.id] ?? 0.0),
    );
  }

  double get totalCOGS => grossCOGS - returnedCOGS;
"""
          once(old,new,'cogs getters')

          old="""    for (final order in orders.where((order) =>
        order.status != 'cancelled' && order.status != 'debt_repayment')) {
      if (protectedOrderCosts.containsKey(order.id)) continue;
      if (order.items.isNotEmpty &&
          order.items.every((item) => item.costPrice != null)) continue;
      return false;
    }
    return true;
"""
          new="""    for (final order in orders.where((order) =>
        order.status != 'cancelled' && order.status != 'debt_repayment')) {
      if (protectedOrderCosts.containsKey(order.id)) continue;
      if (order.items.isNotEmpty &&
          order.items.every((item) => item.costPrice != null)) continue;
      return false;
    }
    for (final value in returns) {
      if (!protectedReturnCosts.containsKey(value.id)) return false;
    }
    return true;
"""
          once(old,new,'cogs completeness')

          old="""  double get totalTaxCollected => orders
          .where((order) =>
              order.status != 'cancelled' && order.status != 'debt_repayment')
          .fold(0.0, (sum, order) {
        double orderTax = 0.0;
        for (final item in order.items) {
          final itemTax = item.getEffectiveTax(defaultTaxPercentage);
          if (itemTax <= 0) continue;
          final isInclusive = item.isTaxInclusive ?? defaultIsTaxInclusive;
          final taxableBase = item.total - (item.discountAmount ?? 0.0);
          orderTax += isInclusive
              ? taxableBase - (taxableBase / (1 + (itemTax / 100)))
              : taxableBase * (itemTax / 100);
        }
        return sum + orderTax;
      });
"""
          new="""  double get grossTaxCollected => orders
          .where((order) =>
              order.status != 'cancelled' && order.status != 'debt_repayment')
          .fold(0.0, (sum, order) {
        double orderTax = 0.0;
        for (final item in order.items) {
          final itemTax = item.getEffectiveTax(defaultTaxPercentage);
          if (itemTax <= 0) continue;
          final isInclusive = item.isTaxInclusive ?? defaultIsTaxInclusive;
          final taxableBase = item.total - (item.discountAmount ?? 0.0);
          orderTax += isInclusive
              ? taxableBase - (taxableBase / (1 + (itemTax / 100)))
              : taxableBase * (itemTax / 100);
        }
        return sum + orderTax;
      });

  double get returnedTax =>
      returns.fold(0.0, (sum, value) => sum + value.returnedTax);

  double get totalTaxCollected => grossTaxCollected - returnedTax;
"""
          once(old,new,'tax getters')

          old="""    for (final order in orders) {
      if (order.status == 'cancelled' || order.status == 'debt_repayment')
        continue;
      final dateStr =
          '${order.createdAt.year}-${order.createdAt.month.toString().padLeft(2, '0')}-${order.createdAt.day.toString().padLeft(2, '0')}';
      dailyMap[dateStr] = (dailyMap[dateStr] ?? 0.0) + order.total;
    }
"""
          new="""    for (final order in orders) {
      if (order.status == 'cancelled' || order.status == 'debt_repayment')
        continue;
      final dateStr =
          '${order.createdAt.year}-${order.createdAt.month.toString().padLeft(2, '0')}-${order.createdAt.day.toString().padLeft(2, '0')}';
      dailyMap[dateStr] = (dailyMap[dateStr] ?? 0.0) + order.total;
    }
    for (final value in returns) {
      final dateStr =
          '${value.createdAt.year}-${value.createdAt.month.toString().padLeft(2, '0')}-${value.createdAt.day.toString().padLeft(2, '0')}';
      dailyMap[dateStr] = (dailyMap[dateStr] ?? 0.0) - value.returnedTotal;
    }
"""
          once(old,new,'daily returns')

          old="""    for (final order in orders) {
      if (order.status == 'cancelled' || order.status == 'debt_repayment')
        continue;
      for (final item in order.items) {
        qtyMap[item.productId] = (qtyMap[item.productId] ?? 0) + item.quantity;
        revenueMap[item.productId] =
            (revenueMap[item.productId] ?? 0.0) + item.total;
      }
    }
"""
          new="""    for (final order in orders) {
      if (order.status == 'cancelled' || order.status == 'debt_repayment')
        continue;
      for (final item in order.items) {
        qtyMap[item.productId] = (qtyMap[item.productId] ?? 0) + item.quantity;
        revenueMap[item.productId] =
            (revenueMap[item.productId] ?? 0.0) + item.total;
      }
    }
    for (final value in returns) {
      for (final item in value.returnedItems) {
        qtyMap[item.productId] = (qtyMap[item.productId] ?? 0) - item.quantity;
        revenueMap[item.productId] =
            (revenueMap[item.productId] ?? 0.0) - item.total;
      }
    }
"""
          once(old,new,'best seller returns')

          # Insert protected return cost providers after merchantOrderCostsProvider.
          marker="""final reportsServiceProvider = Provider<ReportsService?>((ref) {
"""
          insert="""final branchReturnCostsProvider = StreamProvider<Map<String, double>>((ref) {
  final appUser = ref.watch(appUserProvider).value;
  final policy = ref.watch(accessPolicyProvider);
  if (appUser == null || !policy.canViewCosts || !policy.canViewReports) {
    return Stream.value(const <String, double>{});
  }
  final merchantId = currentEffectiveMerchantId(appUser);
  final branchId = ref.watch(selectedBranchIdProvider);
  return ReturnCostSnapshotRepository(FirebaseFirestore.instance)
      .watchBranchReturnCosts(merchantId, branchId);
});

final merchantReturnCostsProvider = StreamProvider<Map<String, double>>((ref) {
  final appUser = ref.watch(appUserProvider).value;
  final policy = ref.watch(accessPolicyProvider);
  if (appUser == null || !policy.isOwnerLike || !policy.canViewCosts || !policy.canViewReports) {
    return Stream.value(const <String, double>{});
  }
  final merchantId = currentEffectiveMerchantId(appUser);
  return ReturnCostSnapshotRepository(FirebaseFirestore.instance)
      .watchReturnCosts(merchantId);
});

"""+marker
          once(marker,insert,'return cost providers')

          # Branch report provider state + constructor.
          once("""  final debtPaymentsState = ref.watch(branchCustomerDebtPaymentsProvider);
  final storeProfileState = ref.watch(storeProfileProvider);
  final costsState = ref.watch(branchOrderCostsProvider);
""", """  final debtPaymentsState = ref.watch(branchCustomerDebtPaymentsProvider);
  final returnsState = ref.watch(branchOrderReturnsProvider);
  final storeProfileState = ref.watch(storeProfileProvider);
  final costsState = ref.watch(branchOrderCostsProvider);
  final returnCostsState = ref.watch(branchReturnCostsProvider);
""", 'branch states')
          once("""      debtPaymentsState.value == null ||
      (canViewCost && costsState.value == null)) {
""", """      debtPaymentsState.value == null ||
      returnsState.value == null ||
      (canViewCost && (costsState.value == null || returnCostsState.value == null))) {
""", 'branch ready gate')
          once("""    debtPayments: debtPaymentsState.value!,
    protectedOrderCosts: costsState.value ?? const {},
    canViewCost: canViewCost,
""", """    debtPayments: debtPaymentsState.value!,
    returns: returnsState.value!,
    protectedOrderCosts: costsState.value ?? const {},
    protectedReturnCosts: returnCostsState.value ?? const {},
    canViewCost: canViewCost,
""", 'branch constructor')

          # Merchant report provider state + constructor.
          once("""  final debtPaymentsState = ref.watch(merchantCustomerDebtPaymentsProvider);
  final storeProfileState = ref.watch(storeProfileProvider);
  final costsState = ref.watch(merchantOrderCostsProvider);
""", """  final debtPaymentsState = ref.watch(merchantCustomerDebtPaymentsProvider);
  final returnsState = ref.watch(merchantOrderReturnsProvider);
  final storeProfileState = ref.watch(storeProfileProvider);
  final costsState = ref.watch(merchantOrderCostsProvider);
  final returnCostsState = ref.watch(merchantReturnCostsProvider);
""", 'merchant states')
          # second ready gate occurrence (branch one already replaced, now exact original remains once)
          once("""      debtPaymentsState.value == null ||
      (canViewCost && costsState.value == null)) {
""", """      debtPaymentsState.value == null ||
      returnsState.value == null ||
      (canViewCost && (costsState.value == null || returnCostsState.value == null))) {
""", 'merchant ready gate')
          # second constructor occurrence
          once("""    debtPayments: debtPaymentsState.value!,
    protectedOrderCosts: costsState.value ?? const {},
    canViewCost: canViewCost,
""", """    debtPayments: debtPaymentsState.value!,
    returns: returnsState.value!,
    protectedOrderCosts: costsState.value ?? const {},
    protectedReturnCosts: returnCostsState.value ?? const {},
    canViewCost: canViewCost,
""", 'merchant constructor')

          p.write_text(s)
          PY

      - name: Format
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - run: dart format lib/features/reports/data/reports_service.dart lib/features/orders/data/order_return_repository.dart lib/features/orders/data/return_cost_snapshot_repository.dart
      - name: Commit
        shell: bash
        run: |
          git config user.name 'Tajer Accounting Audit'
          git config user.email 'audit@tajer.local'
          git add lib/features/reports/data/reports_service.dart lib/features/orders/data/order_return_repository.dart lib/features/orders/data/return_cost_snapshot_repository.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(accounting): make reports return-aware'
          git push origin HEAD:audit/accounting-integrity-109
