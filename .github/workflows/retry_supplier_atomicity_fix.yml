name: Retry Supplier Atomicity Fix

on:
  push:
    branches: ["audit/pre-google-play-414"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Reuse exact audited supplier patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply_supplier_atomicity_fix.yml').read_text(encoding='utf-8')
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/supplier_fix.py').write_text(code + '\n', encoding='utf-8')
          PY
          python /tmp/supplier_fix.py
          git diff --check
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          printf 'Changed files including untracked:\n%s\n' "$changed"
          test "$changed" = $'lib/features/suppliers/data/supplier_repository.dart\nlib/features/suppliers/presentation/suppliers_screen.dart\ntest/supplier_creation_atomicity_test.dart'

      - name: Verify focused supplier repair
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/supplier_creation_atomicity_test.dart test/pre_release_supplier_branch_debt_test.dart test/pre_release_supplier_reversal_test.dart --reporter expanded
          flutter analyze lib/features/suppliers/data/supplier_repository.dart lib/features/suppliers/presentation/suppliers_screen.dart test/supplier_creation_atomicity_test.dart --no-fatal-warnings --no-fatal-infos

      - name: Commit verified repair
        run: |
          git config user.name "Tajer Audit Bot"
          git config user.email "bot@tajer.local"
          git add lib/features/suppliers/data/supplier_repository.dart lib/features/suppliers/presentation/suppliers_screen.dart test/supplier_creation_atomicity_test.dart
          git commit -m "fix: make supplier creation and opening balance atomic"
          git push origin HEAD:audit/pre-google-play-414
