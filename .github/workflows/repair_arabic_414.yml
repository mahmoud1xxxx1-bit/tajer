name: Repair Arabic 414
on:
  push:
    branches: [agent/arabic-fix-414]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and verify Arabic ARB only
        run: |
          python -m pip install --quiet ftfy
          python - <<'PY'
          import json
          from pathlib import Path
          from ftfy import fix_text
          p=Path('lib/l10n/app_ar.arb')
          raw=p.read_text(encoding='utf-8-sig')
          data=json.loads(raw)
          keys_before=list(data.keys())
          protected={k:data[k] for k in ('freeLimitReachedTitle','freeLimitReachedMessage','later','viewPlans') if k in data}
          changed=0
          def repair(v):
              global changed
              if isinstance(v,str):
                  nv=fix_text(v)
                  if nv!=v: changed+=1
                  return nv
              if isinstance(v,dict): return {k:repair(x) for k,x in v.items()}
              if isinstance(v,list): return [repair(x) for x in v]
              return v
          fixed={k:repair(v) for k,v in data.items()}
          assert list(fixed.keys())==keys_before
          assert {k:fixed[k] for k in protected}==protected
          out=json.dumps(fixed,ensure_ascii=False,indent=2)+'\n'
          json.loads(out)
          bad=('Ø','Ù','Ã','Â','ðŸ','âœ','âš','ï¸','�')
          leftovers=[m for m in bad if m in out]
          if leftovers: raise SystemExit('Mojibake remains: '+repr(leftovers))
          p.write_text(out,encoding='utf-8',newline='\n')
          print('KEY_COUNT',len(keys_before),'CHANGED',changed)
          print('appTitle=',fixed.get('appTitle'))
          print('paywallMainPlan=',fixed.get('paywallMainPlan'))
          print('freeLimitReachedTitle=',fixed.get('freeLimitReachedTitle'))
          PY
          test "$(git diff --name-only)" = "lib/l10n/app_ar.arb"
      - name: Commit repaired file
        run: |
          git config user.name 'Tajer Repair Bot'
          git config user.email 'bot@tajer.local'
          git add lib/l10n/app_ar.arb
          git commit -m 'fix(l10n): repair Arabic encoding from build 414 source'
          git push origin HEAD:agent/arabic-fix-414
