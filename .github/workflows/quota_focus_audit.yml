name: Quota Focus Audit
on:
  push:
    branches: ["audit/pre-google-play-414"]
permissions:
  contents: read
jobs:
  quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/pre_release_free_quota_atomicity_test.dart --reporter expanded
