name: Build Android App Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.0'
        channel: 'stable'
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json

    - name: Set up Java for Firebase emulator
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Android release keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

    - name: Install dependencies
      run: flutter pub get --enforce-lockfile

    - name: Install trusted backend dependencies
      run: npm ci
      working-directory: functions

    - name: Generate localizations
      run: flutter gen-l10n

    - name: Run build_runner
      run: dart run build_runner build -d

    - name: Analyze application code
      run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

    - name: Validate trusted backend syntax
      run: node --check functions/index.js

    - name: Run Firestore rules emulator tests
      run: npx firebase-tools emulators:exec --project demo-tajer-rules --only firestore "npm --prefix functions run test:rules"

    - name: Run regression tests
      run: flutter test

    - name: Build Android App Bundle
      run: flutter build appbundle --release 
      env:
        TAJER_STOREFILE: upload-keystore.jks
        TAJER_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        TAJER_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        TAJER_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/bundle/release/app-release.aab
        if-no-files-found: error
