name: QA 608 - Supplier Tests 5 and 16

on:
  push:
    branches:
      - qa/release-125-608-34-tests
    paths:
      - '.github/workflows/qa_608_supplier_tests.yml'
      - 'integration_test/qa_608_supplier_lifecycle_concurrency_test.dart'
  workflow_dispatch:

jobs:
  supplier-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove supplier source matches #608 except verified Test 8 UI fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=10c53365bb2c8cc15a6dcb88020a03529f98cbb3
          allowed='lib/features/employees/presentation/employee_permissions_screen.dart'
          changed=$(git diff --name-only "$BASE"...HEAD -- lib/ pubspec.yaml firestore.rules firebase.json .firebaserc || true)
          forbidden=$(printf '%s\n' "$changed" | grep -v '^$' | grep -v "^${allowed}$" || true)
          test -z "$forbidden" || { echo "$forbidden"; exit 2; }
          git diff --quiet "$BASE"...HEAD -- \
            lib/features/suppliers \
            lib/features/expenses \
            firestore.rules
          echo PASS_SOURCE_GUARD_SUPPLIER_IS_608
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build -d
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global firebase-tools
      - name: Start Firebase emulators
        shell: bash
        run: |
          firebase emulators:start --only auth,firestore --project tajer-19289 > supplier-firebase.log 2>&1 &
          for i in {1..90}; do
            curl -fsS http://127.0.0.1:8080 >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat supplier-firebase.log
          exit 1
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute TEST 5 and TEST 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/qa_608_supplier_lifecycle_concurrency_test.dart -d emulator-5554 --dart-define=USE_EMULATOR=true
      - name: Upload Firebase log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-firebase-log
          path: supplier-firebase.log
          if-no-files-found: ignore
# CI retry after transient dependency-host 403 on 2026-08-16
