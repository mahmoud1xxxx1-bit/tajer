name: Deploy Accounting Backend 109

on:
  push:
    branches:
      - audit/accounting-integrity-109
    paths:
      - .github/workflows/deploy_accounting_backend_109.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/accounting-integrity-109
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install backend dependencies
        working-directory: functions
        run: npm ci

      - name: Validate backend syntax
        run: node --check functions/index.js

      - name: Require Firebase deployment credential
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_DEPLOY_CREDENTIAL_MISSING"
            exit 2
          fi
          echo "FIREBASE_DEPLOY_CREDENTIAL_PRESENT"

      - name: Deploy verified Firestore rules and Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >-
          npx firebase-tools deploy
          --project tajer-19289
          --only firestore:rules,functions
          --non-interactive
          --token "$FIREBASE_TOKEN"
