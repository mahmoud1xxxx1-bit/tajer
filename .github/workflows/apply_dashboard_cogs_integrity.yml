name: Apply Dashboard and COGS Integrity

on:
  push:
    branches:
      - audit/accounting-integrity-109
    paths:
      - tool/patch_dashboard_cogs_integrity.py
      - .github/workflows/apply_dashboard_cogs_integrity.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/accounting-integrity-109
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply accounting-safe patch
        run: python3 tool/patch_dashboard_cogs_integrity.py

      - name: Format Dart files
        run: dart format lib/features/dashboard/domain/dashboard_daily_metrics.dart lib/features/dashboard/presentation/dashboard_screen.dart lib/features/reports/presentation/reports_screen.dart test/dashboard_daily_metrics_test.dart

      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Dashboard daily metrics regression
        run: flutter test test/dashboard_daily_metrics_test.dart

      - name: Reports and trusted COGS regressions
        run: |
          flutter test test/reports_service_test.dart
          flutter test test/accounting_return_report_integrity_test.dart
          flutter test test/trusted_cogs_backend_contract_test.dart

      - name: Install rules test dependencies
        working-directory: functions
        run: npm ci

      - name: Firestore rules emulator tests
        run: npx firebase-tools emulators:exec --project demo-tajer-rules --only firestore "npm --prefix functions run test:rules"

      - name: Analyze touched application surfaces
        run: flutter analyze lib/features/dashboard lib/features/reports --no-fatal-warnings --no-fatal-infos

      - name: Verify diff
        run: git diff --check

      - name: Commit verified patch
        run: |
          git config user.name "tajer-accounting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/features/dashboard/domain/dashboard_daily_metrics.dart lib/features/dashboard/presentation/dashboard_screen.dart lib/features/reports/presentation/reports_screen.dart firestore.rules test/dashboard_daily_metrics_test.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(accounting): correct dashboard daily scope and COGS integrity"
          git push origin HEAD:audit/accounting-integrity-109
