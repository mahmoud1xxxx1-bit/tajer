name: Apply Dashboard Daily Totals Fix

on:
  push:
    branches: [ "audit/pre-google-play-414" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pre-google-play-414

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Materialize guarded fix payloads
        shell: bash
        run: |
          echo '' | base64 --decode > lib/features/dashboard/presentation/dashboard_daily_summary.dart
          echo '' | base64 --decode > test/dashboard_daily_summary_test.dart
          echo '' | base64 --decode > /tmp/dashboard_patch.py

      - name: Apply dashboard patch
        run: python /tmp/dashboard_patch.py

      - name: Format changed Dart files
        run: dart format lib/features/dashboard/presentation/dashboard_screen.dart lib/features/dashboard/presentation/dashboard_daily_summary.dart test/dashboard_daily_summary_test.dart

      - name: Analyze dashboard fix
        run: flutter analyze lib/features/dashboard/presentation/dashboard_screen.dart lib/features/dashboard/presentation/dashboard_daily_summary.dart test/dashboard_daily_summary_test.dart --no-fatal-warnings --no-fatal-infos

      - name: Dashboard daily totals regression test
        run: flutter test test/dashboard_daily_summary_test.dart --reporter expanded

      - name: Orders regression tests
        shell: bash
        run: |
          flutter test test/branch_inventory_order_lifecycle_contract_test.dart --reporter expanded
          flutter test test/pre_release_accounting_matrix_test.dart --reporter expanded

      - name: Verify intended diff only
        shell: bash
        run: |
          git status --short
          python - <<'PY'
          import subprocess
          paths = {line[3:] for line in subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()}
          expected = {
            'lib/features/dashboard/presentation/dashboard_screen.dart',
            'lib/features/dashboard/presentation/dashboard_daily_summary.dart',
            'test/dashboard_daily_summary_test.dart',
          }
          assert paths == expected, (paths, expected)
          PY

      - name: Commit verified dashboard fix
        shell: bash
        run: |
          git config user.name "Tajer Audit Bot"
          git config user.email "actions@github.com"
          git add lib/features/dashboard/presentation/dashboard_screen.dart \
                  lib/features/dashboard/presentation/dashboard_daily_summary.dart \
                  test/dashboard_daily_summary_test.dart
          git commit -m "fix(dashboard): scope sales and order count to today"
          git push origin HEAD:audit/pre-google-play-414
