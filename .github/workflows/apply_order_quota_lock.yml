name: Apply Order Quota Lock Coupling

on:
  push:
    branches:
      - audit/pre-google-play-414
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pre-google-play-414
          fetch-depth: 0
      - name: Couple createOrder to quota lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/orders/data/branch_aware_order_repository.dart')
          text = p.read_text()
          old_start = """  Future<AppOrder> createOrder(\n    AppOrder order, {\n    String? shiftId,\n    String? branchId,\n  }) async {\n    final effectiveBranchId = _operationBranch(branchId ?? order.branchId);"""
          new_start = """  Future<AppOrder> createOrder(\n    AppOrder order, {\n    String? shiftId,\n    String? branchId,\n  }) async {\n    return EntitlementIntegration.runWithQuotaLock<AppOrder>(\n      merchantId: order.merchantId,\n      resourceType: 'orders',\n      action: () async {\n        final effectiveBranchId = _operationBranch(branchId ?? order.branchId);"""
          if text.count(old_start) != 1:
              raise SystemExit(f'createOrder start expected 1 match, got {text.count(old_start)}')
          text = text.replace(old_start, new_start, 1)

          old_end = """    return createdOrder;\n  }\n\n  @override\n  Stream<List<AppOrder>> watchOrders"""
          new_end = """        return createdOrder;\n      },\n    );\n  }\n\n  @override\n  Stream<List<AppOrder>> watchOrders"""
          if text.count(old_end) != 1:
              raise SystemExit(f'createOrder end expected 1 match, got {text.count(old_end)}')
          text = text.replace(old_end, new_end, 1)
          p.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format
        run: dart format lib/features/orders/data/branch_aware_order_repository.dart
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/orders/data/branch_aware_order_repository.dart
          git commit -m 'fix: serialize order creation with quota reservation'
          git push origin HEAD:audit/pre-google-play-414
