name: Patch Reports Scope UI

on:
  push:
    branches:
      - feature/multi-branch-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-branch-v1
          fetch-depth: 0
      - name: Apply exact report scope UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/reports/presentation/reports_screen.dart')
          text = path.read_text()

          old_provider = "final baseReportsService = ref.watch(reportsServiceProvider);"
          new_provider = "final baseReportsService = ref.watch(activeReportsServiceProvider);"
          if old_provider not in text:
              raise SystemExit('Expected reports provider line not found; refusing broad patch.')
          text = text.replace(old_provider, new_provider, 1)

          old_is_ar = "final isAr = Localizations.localeOf(context).languageCode == 'ar';"
          new_is_ar = """final isAr = Localizations.localeOf(context).languageCode == 'ar';
    final reportScope = ref.watch(reportsScopeProvider);"""
          if old_is_ar not in text:
              raise SystemExit('Expected locale line not found; refusing broad patch.')
          text = text.replace(old_is_ar, new_is_ar, 1)

          marker = """                DropdownButton<String>(
                  value: _selectedFilter,"""
          replacement = """                DropdownButton<ReportsScope>(
                  value: reportScope,
                  items: [
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.branch,
                      child: Text(
                        isAr ? 'الفرع الحالي' : 'Current branch',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.merchant,
                      child: Text(
                        isAr ? 'جميع الفروع' : 'All branches',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                  ],
                  onChanged: (scope) {
                    if (scope != null) {
                      ref.read(reportsScopeProvider.notifier).state = scope;
                    }
                  },
                ),
                const SizedBox(width: 12),
                DropdownButton<String>(
                  value: _selectedFilter,"""
          if marker not in text:
              raise SystemExit('Expected report filter dropdown marker not found; refusing broad patch.')
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY
      - name: Commit surgical UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/reports/presentation/reports_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(reports): add branch vs all-branches scope selector"
          git push origin HEAD:feature/multi-branch-v1
