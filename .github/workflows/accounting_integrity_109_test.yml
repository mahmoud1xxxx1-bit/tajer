name: Accounting Integrity 109 Test

on:
  push:
    branches:
      - audit/accounting-integrity-109

permissions:
  contents: write

jobs:
  accounting-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/accounting-integrity-109
          fetch-depth: 0

      - name: Persist selected purchase date wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/suppliers/presentation/purchase_invoice_screen.dart')
          text = path.read_text()
          old = """        isFromShiftDrawer: _isFromShiftDrawer,\n        shiftId: shiftId,\n"""
          new = """        isFromShiftDrawer: _isFromShiftDrawer,\n        occurredAt: _purchaseDate,\n        shiftId: shiftId,\n"""
          if 'occurredAt: _purchaseDate' not in text:
              if old not in text:
                  raise SystemExit('Purchase date wiring anchor not found')
              path.write_text(text.replace(old, new, 1))
          PY
          if ! git diff --quiet -- lib/features/suppliers/presentation/purchase_invoice_screen.dart; then
            git config user.name "tajer-accounting-bot"
            git config user.email "actions@users.noreply.github.com"
            git add lib/features/suppliers/presentation/purchase_invoice_screen.dart
            git commit -m "fix(accounting): honor selected purchase invoice date"
            git push origin HEAD:audit/accounting-integrity-109
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Core accounting reference models
        run: |
          flutter test test/accounting_reference_model_test.dart
          flutter test test/accounting_return_report_integrity_test.dart
          flutter test test/pre_release_accounting_matrix_test.dart
          flutter test test/pre_release_accounting_edge_cases_test.dart

      - name: Customer debt and collections
        run: |
          flutter test test/customer_branch_debt_isolation_test.dart
          flutter test test/customer_debt_payment_test.dart

      - name: Sales, discounts and returns
        run: |
          flutter test test/discount_validation_test.dart
          flutter test test/partial_return_test.dart
          flutter test test/pre_release_partial_return_integration_test.dart

      - name: Supplier debt, settlements and purchase invoices
        run: |
          flutter test test/pre_release_supplier_branch_debt_test.dart
          flutter test test/pre_release_supplier_reversal_test.dart
          flutter test test/purchase_invoice_test.dart

      - name: Reports and shift reconciliation
        run: |
          flutter test test/report_cashflow_ledger_test.dart
          flutter test test/report_scope_policy_test.dart
          flutter test test/reports_service_test.dart
          flutter test test/shift_report_reconciliation_test.dart
          flutter test test/trusted_cogs_backend_contract_test.dart

      - name: Localization integrity
        run: flutter test test/localization_integrity_test.dart

      - name: Analyze accounting surfaces
        run: >-
          flutter analyze
          lib/features/orders
          lib/features/customers
          lib/features/suppliers
          lib/features/expenses
          lib/features/shifts
          lib/features/reports
          lib/core/services/excel_service.dart
          --no-fatal-warnings
          --no-fatal-infos

      - name: Decode official Android release keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Verify exact v1.0.107 certificate and Google Sign-In registration
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /tmp/current-release-cert.txt

          git show v1.0.107:android/app/tajer-release.jks > /tmp/v107-release.jks
          test -s /tmp/v107-release.jks
          keytool -list -v \
            -keystore /tmp/v107-release.jks \
            -storepass "tajer123" \
            -alias "tajer" > /tmp/v107-release-cert.txt

          python3 - <<'PY'
          import json, re

          def sha1_from(path):
              text = open(path, encoding='utf-8').read()
              match = re.search(r'SHA1:\s*([0-9A-F:]+)', text)
              if not match:
                  raise SystemExit(f'FAIL: unable to read SHA-1 from {path}')
              return match.group(1).replace(':', '').lower()

          current_sha1 = sha1_from('/tmp/current-release-cert.txt')
          v107_sha1 = sha1_from('/tmp/v107-release-cert.txt')

          print('CURRENT_RELEASE_SHA1=' + current_sha1)
          print('V107_RELEASE_SHA1=' + v107_sha1)
          if current_sha1 != v107_sha1:
              raise SystemExit('FAIL: current release certificate does not match known-good v1.0.107 certificate')
          print('V107_SIGNING_CERTIFICATE_MATCH=PASS')

          with open('android/app/google-services.json', encoding='utf-8') as f:
              cfg = json.load(f)

          registered = {
              client['android_info']['certificate_hash'].lower()
              for app in cfg.get('client', [])
              for client in app.get('oauth_client', [])
              if client.get('client_type') == 1
              and client.get('android_info', {}).get('package_name') == 'com.allldown.tajer'
              and client.get('android_info', {}).get('certificate_hash')
          }

          if current_sha1 not in registered:
              raise SystemExit('FAIL: v1.0.107 release certificate is not registered for Google Sign-In')
          print('GOOGLE_SIGN_IN_CERTIFICATE_MATCH=PASS')
          PY

      - name: Generate localizations for release
        run: flutter gen-l10n

      - name: Build signed Release APK only
        run: flutter build apk --release
        env:
          TAJER_STOREFILE: upload-keystore.jks
          TAJER_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAJER_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAJER_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify release artifact
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          rm -f build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Tajer signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tajer-1.1.109-accounting-audit-signed-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
