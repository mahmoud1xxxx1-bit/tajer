name: Multi-Branch Validation

on:
  push:
    branches: [ "feature/multi-branch-v1" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install trusted backend dependencies
        run: npm ci
        working-directory: functions

      - name: Decode Android release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build runner
        run: dart run build_runner build -d

      - name: Analyze application code
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Validate trusted backend syntax
        run: node --check functions/index.js

      - name: Run Firestore rules emulator tests
        run: npx firebase-tools emulators:exec --project demo-tajer-rules --only firestore "npm --prefix functions run test:rules"

      - name: Run multi-branch regression tests
        run: |
          flutter test test/multi_branch_backward_compatibility_test.dart
          flutter test test/customer_debt_payment_test.dart
          flutter test test/firestore_rules_contract_test.dart
          flutter test test/reports_service_test.dart
          flutter test test/report_cashflow_ledger_test.dart
          flutter test test/shift_report_reconciliation_test.dart
          flutter test test/report_scope_policy_test.dart
          flutter test test/branch_inventory_atomicity_contract_test.dart
          flutter test test/branch_inventory_scope_contract_test.dart
          flutter test test/branch_inventory_order_lifecycle_contract_test.dart
          flutter test test/branch_inventory_manual_adjustment_contract_test.dart
          flutter test test/branch_inventory_concurrency_contract_test.dart
          flutter test test/employee_branch_access_policy_test.dart
          flutter test test/employee_permission_catalog_test.dart
          flutter test test/employee_permission_presentation_test.dart
          flutter test test/employee_permission_atomicity_contract_test.dart
          flutter test test/order_cost_privacy_contract_test.dart
          flutter test test/trusted_cogs_backend_contract_test.dart

      - name: Build Web
        run: flutter build web --release --base-href /taj/

      - name: Build installable Android test APK
        run: flutter build apk --debug

      - name: Verify test APK
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: tajer-1.1.108-android-test-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajer-multi-branch-development-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Build Android APK
        run: flutter build apk --release
        env:
          TAJER_STOREFILE: upload-keystore.jks
          TAJER_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAJER_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAJER_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android App Bundle
        run: flutter build appbundle --release
        env:
          TAJER_STOREFILE: upload-keystore.jks
          TAJER_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAJER_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAJER_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajer-multi-branch-development-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tajer-multi-branch-development-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
