name: Multi-Branch Validation

on:
  push:
    branches: [ "feature/multi-branch-v1" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build runner
        run: dart run build_runner build -d

      - name: Analyze application code
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run multi-branch regression tests
        run: flutter test test/multi_branch_backward_compatibility_test.dart

      - name: Build Web
        run: flutter build web --release --base-href /taj/

      - name: Build Android APK
        run: flutter build apk --release
