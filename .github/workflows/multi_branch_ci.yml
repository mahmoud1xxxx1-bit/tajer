name: Multi-Branch Validation

on:
  push:
    branches: [ "feature/multi-branch-v1" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: feature/multi-branch-v1
          fetch-depth: 0

      - name: Apply guarded bilingual report scope patch
        if: github.actor != 'github-actions[bot]'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/reports/presentation/reports_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = "final baseReportsService = ref.watch(reportsServiceProvider);"
          new = "final baseReportsService = ref.watch(activeReportsServiceProvider);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one base report provider marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "final isAr = Localizations.localeOf(context).languageCode == 'ar';"
          new = """final isAr = Localizations.localeOf(context).languageCode == 'ar';
    final reportScope = ref.watch(reportsScopeProvider);"""
          if text.count(old) < 1:
              raise SystemExit('Locale marker missing')
          text = text.replace(old, new, 1)

          old = """              children: [
                DropdownButton<String>(
                  value: _selectedFilter,"""
          new = """              children: [
                DropdownButton<ReportsScope>(
                  value: reportScope,
                  items: [
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.branch,
                      child: Text(
                        isAr ? 'الفرع الحالي' : 'Current branch',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.merchant,
                      child: Text(
                        isAr ? 'جميع الفروع' : 'All branches',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                  ],
                  onChanged: (scope) {
                    if (scope != null) {
                      ref.read(reportsScopeProvider.notifier).state = scope;
                    }
                  },
                ),
                const SizedBox(width: 12),
                DropdownButton<String>(
                  value: _selectedFilter,"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one date dropdown marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "lib/features/reports/presentation/reports_screen.dart"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/reports/presentation/reports_screen.dart
          git commit -m "feat(reports): add bilingual branch vs all-branches selector"
          git push origin HEAD:feature/multi-branch-v1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'any'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run build runner
        run: dart run build_runner build -d

      - name: Analyze application code
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run multi-branch regression tests
        run: |
          flutter test test/multi_branch_backward_compatibility_test.dart
          flutter test test/customer_debt_payment_test.dart
          flutter test test/firestore_rules_contract_test.dart
          flutter test test/reports_service_test.dart
          flutter test test/report_cashflow_ledger_test.dart

      - name: Build Web
        run: flutter build web --release --base-href /taj/

      - name: Build Android APK
        run: flutter build apk --release