name: Apply Final Pre-Release Accounting Fixes

on:
  push:
    branches:
      - audit/pre-google-play-414
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pre-google-play-414
          fetch-depth: 0

      - name: Apply verified accounting and quota fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'patched {label}')

          # 1) Couple order quota to the same Firestore transaction as order creation.
          path = 'lib/features/orders/data/branch_aware_order_repository.dart'
          replace_once(
              path,
              """    await EntitlementIntegration.checkAndConsumeQuota(\n      firestore: firestore,\n      merchantId: order.merchantId,\n      branchId: _operationBranch(branchId ?? order.branchId),\n      resourceType: 'orders',\n      plan: null,\n    );\n    final canReadCosts = await _canReadCosts();\n    final effectiveBranchId = _operationBranch(branchId ?? order.branchId);""",
              """    final effectiveBranchId = _operationBranch(branchId ?? order.branchId);\n    final quotaReservation = await EntitlementIntegration.prepareQuotaReservation(\n      firestore: firestore,\n      merchantId: order.merchantId,\n      branchId: effectiveBranchId,\n      resourceType: 'orders',\n      plan: null,\n    );\n    final canReadCosts = await _canReadCosts();""",
              'order quota reservation',
          )
          replace_once(
              path,
              """        return AppOrder.fromJson(existingData);\n      }\n\n      final counterSnap = await tx.get(counterRef);""",
              """        return AppOrder.fromJson(existingData);\n      }\n\n      // Read and validate quota inside this transaction. The write is deferred\n      // until every business read has completed, so a failed order consumes no slot.\n      final quotaConsumption = await quotaReservation.validate(tx);\n\n      final counterSnap = await tx.get(counterRef);""",
              'order quota validation',
          )
          replace_once(
              path,
              """      tx.set(orderRef, orderWithCostSnapshot.toJson());\n      return orderWithCostSnapshot;""",
              """      quotaConsumption.apply(tx);\n      tx.set(orderRef, orderWithCostSnapshot.toJson());\n      return orderWithCostSnapshot;""",
              'order quota commit',
          )
          replace_once(
              path,
              """      final tax = item.taxPercentage ?? 0.0;""",
              """      final tax = item.getEffectiveTax(0.0);""",
              'branch-aware shift tax mode',
          )

          # 2) Persist the real invoice total, never tendered cash/change.
          path = 'lib/features/orders/presentation/pos_screen.dart'
          replace_once(
              path,
              """  final double paidAmount;\n  final bool isCredit;""",
              """  final double paidAmount;\n  final double orderTotal;\n  final bool isCredit;""",
              'OrderDetails total field',
          )
          replace_once(
              path,
              """      required this.paidAmount,\n      required this.isCredit,""",
              """      required this.paidAmount,\n      required this.orderTotal,\n      required this.isCredit,""",
              'OrderDetails total constructor',
          )
          replace_once(
              path,
              """        total: details.paidAmount + (details.tenderedAmount != null && details.changeAmount != null ? details.changeAmount! : 0) + (details.isCredit && details.paidAmount < _grandTotal ? (_grandTotal - details.paidAmount) : 0),""",
              """        total: details.orderTotal,""",
              'AppOrder canonical total',
          )
          replace_once(
              path,
              """                    paidAmount: paid,\n                    isCredit: _isCredit || paid < grandTotal,""",
              """                    paidAmount: paid,\n                    orderTotal: grandTotal,\n                    isCredit: _isCredit || paid < grandTotal,""",
              'checkout final total snapshot',
          )

          # New cart items already snapshot the effective inclusive mode. Use it.
          p = Path(path)
          text = p.read_text()
          old = """final isInclusive = item.taxMode == TaxMode.custom\n          ? (item.isTaxInclusive ?? defaultIsTaxInclusive)\n          : defaultIsTaxInclusive;"""
          count = text.count(old)
          if count < 1:
              raise SystemExit(f'POS inclusive snapshot: expected >=1 match, found {count}')
          text = text.replace(old, "final isInclusive = item.isTaxInclusive ?? defaultIsTaxInclusive;")
          p.write_text(text)
          print(f'patched POS inclusive snapshot ({count} occurrence(s))')

          # 3) Historical order details: TaxMode-aware tax and cash tender/change display.
          path = 'lib/features/orders/presentation/order_details_screen.dart'
          replace_once(
              path,
              """                          final taxRate = item.taxPercentage ?? defaultTaxPercentage;\n                          final isInclusive = (item.taxPercentage != null && item.taxPercentage! > 0) ? (item.isTaxInclusive ?? defaultIsTaxInclusive) : defaultIsTaxInclusive;""",
              """                          final taxRate = item.getEffectiveTax(defaultTaxPercentage);\n                          final isInclusive = item.isTaxInclusive ?? defaultIsTaxInclusive;""",
              'order details tax mode',
          )
          replace_once(
              path,
              """                            grandTotal += item.total;""",
              """                            grandTotal += taxableBase;""",
              'order details no-tax discounted total',
          )
          replace_once(
              path,
              """                          '${(currentOrder.paidAmount ?? currentOrder.total).toStringAsFixed(2)} ${currency.code}',""",
              """                          '${currentOrder.paidAmount.toStringAsFixed(2)} ${currency.code}',""",
              'order details paid amount',
          )
          replace_once(
              path,
              """                            '${(currentOrder.total - (currentOrder.paidAmount ?? 0.0)).clamp(0.0, double.infinity).toStringAsFixed(2)} ${currency.code}',""",
              """                            '${(currentOrder.total - currentOrder.paidAmount).clamp(0.0, double.infinity).toStringAsFixed(2)} ${currency.code}',""",
              'order details credit remaining',
          )
          replace_once(
              path,
              """                    if (currentOrder.isCredit) ...[""",
              """                    if (currentOrder.paymentMethod == 'cash' &&\n                        currentOrder.tenderedAmount != null) ...[\n                      const SizedBox(height: 8),\n                      Row(\n                        mainAxisAlignment: MainAxisAlignment.spaceBetween,\n                        children: [\n                          Text(isAr ? 'المبلغ المستلم' : 'Tendered Amount', style: const TextStyle(fontFamily: 'Tajawal', fontSize: 16)),\n                          Text(\n                            '${currentOrder.tenderedAmount!.toStringAsFixed(2)} ${currency.code}',\n                            style: const TextStyle(fontFamily: 'Tajawal', fontSize: 16, fontWeight: FontWeight.bold),\n                          ),\n                        ],\n                      ),\n                    ],\n                    if (currentOrder.paymentMethod == 'cash' &&\n                        currentOrder.changeAmount != null) ...[\n                      const SizedBox(height: 8),\n                      Row(\n                        mainAxisAlignment: MainAxisAlignment.spaceBetween,\n                        children: [\n                          Text(isAr ? 'الباقي للعميل' : 'Change', style: const TextStyle(fontFamily: 'Tajawal', fontSize: 16, color: Colors.blue)),\n                          Text(\n                            '${currentOrder.changeAmount!.clamp(0.0, double.infinity).toStringAsFixed(2)} ${currency.code}',\n                            style: const TextStyle(fontFamily: 'Tajawal', fontSize: 16, fontWeight: FontWeight.bold, color: Colors.blue),\n                          ),\n                        ],\n                      ),\n                    ],\n                    if (currentOrder.isCredit) ...[""",
              'order details tender and change rows',
          )

          # 4) PDF/ZATCA tax calculations must honor TaxMode, especially exempt.
          path = 'lib/core/services/pdf_service.dart'
          p = Path(path)
          text = p.read_text()
          old = "final taxRate = item.taxPercentage ?? 0.0;"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'PDF tax rate: expected 2 matches, found {count}')
          text = text.replace(old, "final taxRate = item.getEffectiveTax(taxPercentage ?? 0.0);")
          p.write_text(text)
          print('patched PDF/ZATCA TaxMode handling (2 occurrences)')
          PY

      - name: Format modified Dart files
        run: dart format lib/core/services/entitlement_integration.dart lib/features/orders/data/branch_aware_order_repository.dart lib/features/orders/presentation/pos_screen.dart lib/features/orders/presentation/order_details_screen.dart lib/core/services/pdf_service.dart

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/entitlement_integration.dart \
                  lib/features/orders/data/branch_aware_order_repository.dart \
                  lib/features/orders/presentation/pos_screen.dart \
                  lib/features/orders/presentation/order_details_screen.dart \
                  lib/core/services/pdf_service.dart
          git commit -m 'fix: close quota invoice total and tax snapshot gaps'
          git push origin HEAD:audit/pre-google-play-414
