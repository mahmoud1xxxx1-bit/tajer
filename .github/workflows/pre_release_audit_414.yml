name: Pre Release Audit 414

on:
  push:
    branches: [ "audit/pre-google-play-414" ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Backend dependencies
        run: npm ci
        working-directory: functions
      - name: Localization generation
        run: flutter gen-l10n
      - name: Localization integrity scan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('lib/l10n/app_ar.arb')
          data=json.loads(p.read_text(encoding='utf-8-sig'))
          bad=('Ã','Â','Ø','Ù','â€','ðŸ','ï¿½','�')
          hits=[]
          for k,v in data.items():
            if isinstance(v,str) and any(x in v for x in bad): hits.append((k,v))
          print('ARB_KEYS', len(data))
          print('MOJIBAKE_HITS', len(hits))
          if hits:
            print(hits[:30])
            raise SystemExit(1)
          required=['paywallMainPlan','paywallMultiPlan','freeLimitReachedTitle','freeLimitReachedMessage','later','viewPlans']
          missing=[k for k in required if k not in data]
          print('MISSING_REQUIRED_KEYS', missing)
          if missing: raise SystemExit(1)
          PY
      - name: Build runner
        run: dart run build_runner build -d
      - name: Analyze full application
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Backend syntax
        run: node --check functions/index.js
      - name: Firestore rules emulator tests
        run: npx firebase-tools emulators:exec --project demo-tajer-rules --only firestore "npm --prefix functions run test:rules"
      - name: Full Flutter test suite
        run: flutter test --reporter expanded
      - name: Accounting reference model
        run: flutter test test/accounting_reference_model_test.dart --reporter expanded
      - name: Pre-release accounting matrix
        run: flutter test test/pre_release_accounting_matrix_test.dart --reporter expanded
      - name: Release APK compile gate
        run: flutter build apk --release --no-pub
