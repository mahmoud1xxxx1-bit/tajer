name: QA 608 - TEST 1 Cash Sale

on:
  push:
    branches:
      - qa/release-125-608-34-tests
    paths:
      - '.github/workflows/qa_608_test_01.yml'
      - 'integration_test/**'
      - 'qa/**'
  workflow_dispatch:

jobs:
  test-01-cash-sale:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove only verified production fixes differ from #608
        shell: bash
        run: |
          set -euo pipefail
          BASE=10c53365bb2c8cc15a6dcb88020a03529f98cbb3
          ALLOWED_PERMISSIONS='lib/features/employees/presentation/employee_permissions_screen.dart'
          ALLOWED_DEBT='lib/features/orders/data/order_repository.dart'
          ALLOWED_STARTUP='lib/features/authentication/presentation/startup_screen.dart'
          echo "QA HEAD: $(git rev-parse HEAD)"
          echo "BASE   : $BASE"
          changed=$(git diff --name-only "$BASE"...HEAD -- lib/ pubspec.yaml firestore.rules firebase.json .firebaserc || true)
          forbidden=$(printf '%s\n' "$changed" | grep -v '^$' | grep -v "^${ALLOWED_PERMISSIONS}$" | grep -v "^${ALLOWED_DEBT}$" | grep -v "^${ALLOWED_STARTUP}$" || true)
          if [ -n "$forbidden" ]; then
            echo "Forbidden production-source/config differences detected:"
            echo "$forbidden"
            exit 2
          fi
          echo "PASS_SOURCE_GUARD_ONLY_VERIFIED_FIXES"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build -d

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Start isolated Firebase emulators
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:start --only auth,firestore --project tajer-19289 > firebase-emulator.log 2>&1 &
          echo $! > firebase-emulator.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080 >/dev/null 2>&1; then
              echo "Firestore emulator is ready"
              exit 0
            fi
            sleep 1
          done
          cat firebase-emulator.log
          exit 1

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: TEST 1/34 - real Android cash sale cycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test/scenario_01_sales_test.dart -d emulator-5554 --dart-define=USE_EMULATOR=true

      - name: Upload Firebase emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-608-test-01-firebase-log
          path: firebase-emulator.log
          if-no-files-found: ignore
