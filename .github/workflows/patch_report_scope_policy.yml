name: Patch Report Scope Policy

on:
  push:
    branches: [ "feature/multi-branch-v1" ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-branch-v1
          fetch-depth: 0

      - name: Apply guarded report scope policy patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('lib/features/reports/data/reports_service.dart')
          text = service.read_text(encoding='utf-8')

          marker = """enum ReportsScope {
  branch,
  merchant,
}

final reportsScopeProvider = StateProvider<ReportsScope>((ref) {
  return ReportsScope.branch;
});"""
          replacement = """enum ReportsScope {
  branch,
  merchant,
}

ReportsScope resolveReportsScope({
  required String? role,
  required ReportsScope requested,
}) {
  return role == 'merchant' ? requested : ReportsScope.branch;
}

final reportsScopeProvider = StateProvider<ReportsScope>((ref) {
  return ReportsScope.branch;
});

final effectiveReportsScopeProvider = Provider<ReportsScope>((ref) {
  final requested = ref.watch(reportsScopeProvider);
  final role = ref.watch(appUserProvider).value?.role;
  return resolveReportsScope(role: role, requested: requested);
});"""
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one report scope declaration marker, found {text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          old = """final activeReportsServiceProvider = Provider<ReportsService?>((ref) {
  final scope = ref.watch(reportsScopeProvider);
  return scope == ReportsScope.merchant
      ? ref.watch(consolidatedReportsServiceProvider)
      : ref.watch(reportsServiceProvider);
});"""
          new = """final activeReportsServiceProvider = Provider<ReportsService?>((ref) {
  final scope = ref.watch(effectiveReportsScopeProvider);
  return scope == ReportsScope.merchant
      ? ref.watch(consolidatedReportsServiceProvider)
      : ref.watch(reportsServiceProvider);
});"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one active report provider marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          service.write_text(text, encoding='utf-8')

          screen = Path('lib/features/reports/presentation/reports_screen.dart')
          text = screen.read_text(encoding='utf-8')
          old = "final reportScope = ref.watch(reportsScopeProvider);"
          new = """final reportScope = ref.watch(effectiveReportsScopeProvider);
    final canViewAllBranches = appUser?.role == 'merchant';"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one report scope watch marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """                  items: [
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.branch,
                      child: Text(
                        isAr ? 'الفرع الحالي' : 'Current branch',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.merchant,
                      child: Text(
                        isAr ? 'جميع الفروع' : 'All branches',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                  ],"""
          new = """                  items: [
                    DropdownMenuItem<ReportsScope>(
                      value: ReportsScope.branch,
                      child: Text(
                        isAr ? 'الفرع الحالي' : 'Current branch',
                        style: const TextStyle(fontFamily: 'Tajawal'),
                      ),
                    ),
                    if (canViewAllBranches)
                      DropdownMenuItem<ReportsScope>(
                        value: ReportsScope.merchant,
                        child: Text(
                          isAr ? 'جميع الفروع' : 'All branches',
                          style: const TextStyle(fontFamily: 'Tajawal'),
                        ),
                      ),
                  ],"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one scope dropdown items marker, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "title: AppLocalizations.of(context)!.text107,"
          new = """title: reportScope == ReportsScope.merchant
                            ? (isAr ? 'إجمالي الديون المستحقة' : 'Total Outstanding Debt')
                            : (isAr ? 'الديون المستحقة من مبيعات هذا الفرع' : 'Outstanding Debt from This Branch'),"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one debt card title marker, found {text.count(old)}')
          text = text.replace(old, new, 1)
          screen.write_text(text, encoding='utf-8')

          test = Path('test/report_scope_policy_test.dart')
          if test.exists():
              raise SystemExit('report_scope_policy_test.dart already exists')
          test.write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:tajer/features/reports/data/reports_service.dart';

void main() {
  group('Report scope policy', () {
    test('merchant can request consolidated report', () {
      expect(
        resolveReportsScope(role: 'merchant', requested: ReportsScope.merchant),
        ReportsScope.merchant,
      );
    });

    test('employee is always restricted to current branch', () {
      expect(
        resolveReportsScope(role: 'employee', requested: ReportsScope.merchant),
        ReportsScope.branch,
      );
    });

    test('unknown role is restricted to current branch', () {
      expect(
        resolveReportsScope(role: null, requested: ReportsScope.merchant),
        ReportsScope.branch,
      );
    });
  });
}
""", encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/reports/data/reports_service.dart lib/features/reports/presentation/reports_screen.dart test/report_scope_policy_test.dart
          git commit -m "feat(reports): enforce merchant-only consolidated scope and clarify debt labels"
          git push origin HEAD:feature/multi-branch-v1
