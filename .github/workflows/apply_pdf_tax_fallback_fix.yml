name: Apply PDF Tax Fallback Fix

on:
  push:
    branches:
      - audit/pre-google-play-414
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pre-google-play-414
          fetch-depth: 0
      - name: Patch PDF tax fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/core/services/pdf_service.dart')
          text = p.read_text()
          old = "item.getEffectiveTax(\n                            taxPercentage ?? 0.0,\n                          )"
          new = "item.getEffectiveTax(defaultTaxPercentage)"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 PDF fallback matches, found {count}')
          p.write_text(text.replace(old, new))
          print('patched PDF tax fallback occurrences:', count)
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Format
        run: dart format lib/core/services/pdf_service.dart
      - name: Analyze touched file
        run: flutter analyze lib/core/services/pdf_service.dart --no-fatal-warnings --no-fatal-infos
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/services/pdf_service.dart
          git commit -m 'fix: use PDF default tax fallback in invoice builder'
          git push origin HEAD:audit/pre-google-play-414
