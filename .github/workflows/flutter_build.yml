name: Build Tajer App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Get Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install trusted backend dependencies
        run: npm ci
        working-directory: functions

      - name: Decode Android release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Run Build Runner
        run: dart run build_runner build -d

      - name: Analyze Application Code
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Validate Trusted Backend Syntax
        run: node --check functions/index.js

      - name: Run Firestore Rules Emulator Tests
        run: npx firebase-tools emulators:exec --project demo-tajer-rules --only firestore "npm --prefix functions run test:rules"

      - name: Run Regression Tests
        run: |
          flutter test test/multi_branch_backward_compatibility_test.dart
          flutter test test/branch_inventory_scope_contract_test.dart
          flutter test test/order_cost_privacy_contract_test.dart
          flutter test test/trusted_cogs_backend_contract_test.dart
          flutter test test/employee_permission_presentation_test.dart
          flutter test test/employee_permission_atomicity_contract_test.dart

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release
        env:
          TAJER_STOREFILE: upload-keystore.jks
          TAJER_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAJER_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAJER_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build App Bundle
        run: flutter build appbundle --release
        env:
          TAJER_STOREFILE: upload-keystore.jks
          TAJER_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAJER_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAJER_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Web
        run: flutter build web --release --base-href /taj/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tajer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tajer-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: tajer-web
          path: build/web
          if-no-files-found: error

      - name: Clean Target Directory on VPS
        if: github.event_name == 'workflow_dispatch' && success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 163.245.218.57
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            rm -rf /home/alldown.uk/public_html/taj/*

      - name: Deploy to VPS
        if: github.event_name == 'workflow_dispatch' && success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 163.245.218.57
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "build/web/*"
          target: "/home/alldown.uk/public_html/taj"
          strip_components: 2

      - name: Set Permissions on VPS
        if: github.event_name == 'workflow_dispatch' && success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 163.245.218.57
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            chown -R nobody:nobody /home/alldown.uk/public_html/taj
            chmod -R 755 /home/alldown.uk/public_html/taj
