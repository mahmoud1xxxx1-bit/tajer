name: Build Tajer App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0' # Adjust to latest stable
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Run Build Runner
        run: dart run build_runner build -d

      - name: Capture Flutter Analyze
        if: always()
        run: |
          flutter analyze > analyze_log.txt 2>&1 || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add analyze_log.txt
          git commit -m "chore: upload analyze log" || true
          git push || true


      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Build Web
        run: flutter build web --release --web-renderer canvaskit --base-href /taj/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tajer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tajer-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: tajer-web
          path: build/web

      - name: Clean Target Directory on VPS
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 163.245.218.57
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            rm -rf /home/alldown.uk/public_html/taj/*

      - name: Deploy to VPS
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 163.245.218.57
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "build/web/*"
          target: "/home/alldown.uk/public_html/taj"
          strip_components: 2

      - name: Set Permissions on VPS
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 163.245.218.57
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            chown -R nobody:nobody /home/alldown.uk/public_html/taj
            chmod -R 755 /home/alldown.uk/public_html/taj
