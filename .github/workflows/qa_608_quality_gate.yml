name: QA 608 - Full Unit and Static Quality Gate

on:
  push:
    branches:
      - qa/release-125-608-34-tests
    paths:
      - '.github/workflows/qa_608_quality_gate.yml'
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove app source is #608 except verified Test 8 UI fix
        shell: bash
        run: |
          set -euo pipefail
          BASE=10c53365bb2c8cc15a6dcb88020a03529f98cbb3
          allowed='lib/features/employees/presentation/employee_permissions_screen.dart'
          changed=$(git diff --name-only "$BASE"...HEAD -- lib/ pubspec.yaml firestore.rules firebase.json .firebaserc || true)
          forbidden=$(printf '%s\n' "$changed" | grep -v '^$' | grep -v "^${allowed}$" || true)
          test -z "$forbidden" || { echo "$forbidden"; exit 2; }
          echo PASS_SOURCE_GUARD_APP_IS_608_EXCEPT_TEST8_FIX
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build -d
      - name: Run all repository unit/widget tests
        run: flutter test test/
      - name: Run static analysis
        run: flutter analyze
