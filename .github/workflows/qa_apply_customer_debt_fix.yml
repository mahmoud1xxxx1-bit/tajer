name: QA Repair Customer Debt Fix Encoding

on:
  push:
    branches:
      - qa/release-125-608-34-tests
    paths:
      - '.github/workflows/qa_apply_customer_debt_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/release-125-608-34-tests
          fetch-depth: 0

      - name: Repair only message encoding and comment indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          p = Path('lib/features/orders/data/order_repository.dart')
          t = p.read_text(encoding='utf-8')
          s = t.index('  Future<void> payCustomerDebt({')
          e = t.index('  Future<int> getOrderCount', s)
          block = t[s:e]
          msg = base64.b64decode('2YXYqNmE2Log2KfZhNiz2K/Yp9ivINmE2Kcg2YrZhdmD2YYg2KPZhiDZitiq2KzYp9mI2LIg2KfZhNiv2YrZhiDYp9mE2YXYs9iq2K3Zgi4=').decode('utf-8')
          fixed, count = re.subn(r"throw Exception\('[^']*'\);", lambda _: "throw Exception('" + msg + "');", block, count=1)
          if count != 1:
              raise SystemExit(f'Expected one debt exception, got {count}')
          fixed = fixed.replace("      // From here onward there are writes only. Firestore can safely retry the\n    // transaction if another device collects debt at the same time.", "      // From here onward there are writes only. Firestore can safely retry the\n      // transaction if another device collects debt at the same time.")
          n = t[:s] + fixed + t[e:]
          if n == t:
              raise SystemExit('No repair produced')
          p.write_text(n, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "lib/features/orders/data/order_repository.dart"

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'tajer-qa-bot'
          git config user.email 'tajer-qa-bot@users.noreply.github.com'
          git add lib/features/orders/data/order_repository.dart
          git commit -m 'fix(debt): preserve Arabic validation message encoding'
          git push origin HEAD:qa/release-125-608-34-tests
