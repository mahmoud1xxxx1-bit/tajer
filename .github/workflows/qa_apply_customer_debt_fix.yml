name: QA Apply Customer Debt Concurrency Fix

on:
  push:
    branches:
      - qa/release-125-608-34-tests
    paths:
      - '.github/workflows/qa_apply_customer_debt_fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/release-125-608-34-tests
          fetch-depth: 0

      - name: Patch only payCustomerDebt
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('lib/features/orders/data/order_repository.dart'); t=p.read_text(encoding='utf-8'); s=t.index('  Future<void> payCustomerDebt({'); e=t.index('  Future<int> getOrderCount', s); r=base64.b64decode(' ').decode('utf-8'); n=t[:s]+r+t[e:]; assert n!=t; p.write_text(n,encoding='utf-8')"
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "lib/features/orders/data/order_repository.dart" || { echo "$changed"; exit 2; }

      - name: Commit exact source fix
        shell: bash
        run: |
          git config user.name 'tajer-qa-bot'
          git config user.email 'tajer-qa-bot@users.noreply.github.com'
          git add lib/features/orders/data/order_repository.dart
          git commit -m 'fix(debt): make concurrent customer collections retry-safe'
          git push origin HEAD:qa/release-125-608-34-tests
