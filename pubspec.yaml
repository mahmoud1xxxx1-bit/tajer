name: tajer
description: "Tajer - Merchant Inventory and Order Management System"
publish_to: 'none'

version: 1.0.1+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.1

  fl_chart: ^0.65.0
  url_launcher: ^6.2.2
  path_provider: ^2.1.2
  pdf: ^3.10.7
  printing: ^5.11.1
  flutter_staggered_grid_view: ^0.6.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^14.0.0

  # Code Generation Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Monetization
  in_app_purchase: ^3.1.13

  # Scanner
  mobile_scanner: ^5.1.1

  # Charts and Reports
  fl_chart: ^0.68.0

  # PDF Generation and Printing
  pdf: ^3.11.0
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  custom_lint: ^0.6.2
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
